services:
  chatgpt-web2api:
    build:
      context: .
    image: chatgpt-web2api:local
    container_name: chatgpt-web2api
    restart: unless-stopped
    environment:
      W2A_HOST: 0.0.0.0
      W2A_PORT: 8080
      W2A_CDP_PORT: 9222
      W2A_HEADLESS: "true"
      W2A_USER_DATA_DIR: /data/chrome-profile
      W2A_CHROME_EXTRA_ARGS: "--no-sandbox --disable-dev-shm-usage"
      W2A_LOG_LEVEL: INFO
      # Optional: comma-separated API keys. Leave empty for local trusted use.
      # W2A_API_KEYS: sk-local-1,sk-local-2
    ports:
      - "8080:8080"
    volumes:
      - chatgpt_chrome_profile:/data/chrome-profile
      - ./cookies:/data/cookies:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  chatgpt_chrome_profile:
